# iso.toml — ISO installer (bootc-installer / Anaconda)
# Nota: il nuovo image-builder non supporta customizations.timezone/locale per
# bootc-installer. Locale e tastiera sono già nell'immagine (etc/locale.conf,
# etc/vconsole.conf); il timezone è impostato da build_scripts/base/05-theme.sh
# (symlink /etc/localtime -> Europe/Rome).

# Con un kickstart personalizzato, bootc-image-builder non accetta
# [[customizations.user]]: l'utente va definito nel kickstart.
[customizations.installer.kickstart]
contents = """
graphical
user --name=pa --gecos="Amministratore PA" --password=pa --plaintext --groups=wheel --shell=/bin/zsh
"""
