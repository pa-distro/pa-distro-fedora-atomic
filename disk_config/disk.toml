# disk.toml — qcow2 (QEMU/KVM)
# Nota: il nuovo image-builder non supporta customizations.timezone/locale per
# qcow2. Locale e tastiera sono già nell'immagine (etc/locale.conf,
# etc/vconsole.conf); il timezone è impostato da build_scripts/base/05-theme.sh
# (symlink /etc/localtime -> Europe/Rome).

[[customizations.user]]
name = "pa"
description = "Amministratore PA"
password = "pa"                 # ⚠️ cambia
shell = "/bin/zsh"
groups = ["wheel"]
