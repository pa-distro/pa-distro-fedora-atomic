name: build-image

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

env:
  IMAGE_NAME: pa-desktop-aurora
  IMAGE_TAG: latest
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  build:
    name: Build image (stadio A)
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: useblacksmith/checkout@v1

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Setup just
        uses: extractions/setup-just@v2

      # La base kinoite ha ~257 layer: lo store classico overlay2 si ferma a 125
      # ("max depth exceeded" al --load). Lo store containerd non ha questo limite.
      - name: Enable containerd image store
        run: |
          sudo mkdir -p /etc/docker
          if sudo test -s /etc/docker/daemon.json; then cfg=$(sudo cat /etc/docker/daemon.json); else cfg='{}'; fi
          echo "$cfg" | jq '.features["containerd-snapshotter"] = true' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info -f '{{ .DriverStatus }}'

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: Build
        run: just build

      - name: Lint (bootc)
        run: just lint

      - name: Secure Boot check (best effort)
        run: just secureboot

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push
        if: github.event_name != 'pull_request'
        run: just push

      - name: Sign image
        if: github.event_name != 'pull_request'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
        run: |
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
