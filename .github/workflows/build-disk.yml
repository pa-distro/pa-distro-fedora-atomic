name: build-disk

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["build-image"]
    types: [completed]

permissions:
  contents: read
  packages: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

env:
  IMAGE_NAME: pa-desktop-aurora
  IMAGE_TAG: latest
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  BIB_IMAGE: quay.io/centos-bootc/bootc-image-builder:latest

jobs:
  build:
    name: Build disk/ISO (stadio B)
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request') }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Il qcow2 va costruito su un runner GitHub: osbuild monta le partizioni
          # GPT del disco via loop device e la root btrfs, ma il kernel dei runner
          # Blacksmith non ha CONFIG_EFI_PARTITION né btrfs.
          - disk-type: qcow2
            runner: ubuntu-24.04
          - disk-type: anaconda-iso
            runner: blacksmith-8vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: useblacksmith/checkout@v1

      # L'immagine su ghcr.io è privata: l'action fa "sudo podman pull", quindi
      # il login va fatto con podman come root.
      - name: Login to GHCR
        run: echo "${{ github.token }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build disk image
        id: build
        uses: osbuild/bootc-image-builder-action@main
        with:
          builder-image: ${{ env.BIB_IMAGE }}
          config-file: ${{ matrix.disk-type == 'anaconda-iso' && './disk_config/iso.toml' || './disk_config/disk.toml' }}
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          chown: "1000:1000"
          types: ${{ matrix.disk-type }}
          additional-args: --use-librepo=True

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IMAGE_NAME }}-${{ matrix.disk-type }}
          path: ${{ steps.build.outputs.output-directory }}
          if-no-files-found: error
          retention-days: 7
