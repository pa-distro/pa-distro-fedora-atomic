# Marca il registry locale (127.0.0.1:5005) come insicuro (HTTP) per
# containers-common: podman, buildah e il bib (montata in
# /etc/containers/registries.conf.d/localhost.conf come :ro).
# Motivo: podman su Debian/Parrot non fa fallback https->http per localhost,
# e il push/pull del ciclo `just disk-image`/`just iso` verso pa-registry
# lavora in chiaro solo su 127.0.0.1 (nessuna porta esterna).
[[registry]]
location = "localhost:5005"
insecure = true
